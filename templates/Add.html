{% extends "base.html" %}

{% block title %}Add Book{% endblock %}

{% block content %}
<main class="content-shell">
  <section class="content-card form-card">
    <p class="eyebrow">Catalog</p>
    <h1>Add a New Book</h1>
    <p class="section-copy">Create a clean record for a title you want to track in the library.</p>

    <form action="/add" method="POST" class="library-form">
      <div class="form-group">
        <label for="id">Book ID</label>
        <input id="id" type="text" name="id" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="title">Title</label>
        <input id="title" type="text" name="title" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="author">Author</label>
        <input id="author" type="text" name="author" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="quantity">Quantity</label>
        <input id="quantity" type="number" min="0" name="quantity" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="status">Status</label>
        <select id="status" name="status" class="form-control">
          <option value="Available">Available</option>
          <option value="Issued">Issued</option>
        </select>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Add Book</button>
        <a href="/" class="btn btn-outline-light">Cancel</a>
      </div>
    </form>
  </section>
</main>
{% endblock %}
