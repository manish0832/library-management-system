{% extends "base.html" %}

{% block title %}Search Books{% endblock %}

{% block content %}
<main class="content-shell">
  <section class="content-card form-card">
    <p class="eyebrow">Discover</p>
    <h1>Search Books</h1>
    <p class="section-copy">Find matching titles, authors, or records from the current collection.</p>

    <form action="/search" method="POST" class="library-form">
      <div class="form-group">
        <label for="query">Title, author, or keyword</label>
        <input id="query" type="text" name="query" class="form-control" required>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Search</button>
        <a href="/" class="btn btn-outline-light">Cancel</a>
      </div>
    </form>
  </section>
</main>
{% endblock %}
