{% extends "base.html" %}

{% block title %}Issue Book{% endblock %}

{% block content %}
<main class="content-shell">
  <section class="content-card form-card">
    <p class="eyebrow">Circulation</p>
    <h1>Issue Book</h1>
    <p class="section-copy">Reduce the available quantity when a book is checked out.</p>

    <form action="/issue" method="POST" class="library-form">
      <div class="form-group">
        <label for="book_id">Book ID</label>
        <input id="book_id" type="text" name="book_id" class="form-control" required>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Issue Book</button>
        <a href="/" class="btn btn-outline-light">Cancel</a>
      </div>
    </form>
  </section>
</main>
{% endblock %}
