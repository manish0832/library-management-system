{% extends "base.html" %}

{% block title %}Return Book{% endblock %}

{% block content %}
<main class="content-shell">
  <section class="content-card form-card">
    <p class="eyebrow">Circulation</p>
    <h1>Return Book</h1>
    <p class="section-copy">Increase stock when a borrowed book comes back to the library.</p>

    <form action="/return" method="POST" class="library-form">
      <div class="form-group">
        <label for="book_id">Book ID</label>
        <input id="book_id" type="text" name="book_id" class="form-control" required>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Return Book</button>
        <a href="/" class="btn btn-outline-light">Cancel</a>
      </div>
    </form>
  </section>
</main>
{% endblock %}
