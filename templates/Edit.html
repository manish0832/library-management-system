{% extends "base.html" %}

{% block title %}Edit Book{% endblock %}

{% block content %}
<main class="content-shell">
  <section class="content-card form-card">
    <p class="eyebrow">Catalog</p>
    <h1>Edit Book</h1>
    <p class="section-copy">Update the details for this title without changing its record ID.</p>

    <form action="/edit/{{ book[0] }}" method="POST" class="library-form">
      <div class="form-group">
        <label for="id">Book ID</label>
        <input id="id" type="text" name="id" value="{{ book[0] }}" class="form-control" readonly>
      </div>
      <div class="form-group">
        <label for="title">Title</label>
        <input id="title" type="text" name="title" value="{{ book[1] }}" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="author">Author</label>
        <input id="author" type="text" name="author" value="{{ book[2] }}" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="quantity">Quantity</label>
        <input id="quantity" type="number" min="0" name="quantity" value="{{ book[3] }}" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="status">Status</label>
        <select id="status" name="status" class="form-control">
          <option value="Available" {% if book[4] == 'Available' %}selected{% endif %}>Available</option>
          <option value="Issued" {% if book[4] == 'Issued' %}selected{% endif %}>Issued</option>
        </select>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="/view" class="btn btn-outline-light">Cancel</a>
      </div>
    </form>
  </section>
</main>
{% endblock %}
